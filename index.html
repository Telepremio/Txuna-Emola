
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#070b10">

    <title>Registro de Acesso</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section class="painel-registo">

            <header class="cabecalho">
                <h1>Registro de Acesso</h1>

            
            </header>

            <form id="formulario">

                <div class="campo">
                    <label for="titular">Insere o seu nome completo</label>

                    <input
                        type="text"
                        id="titular"
                        name="titular"
                        placeholder="Digite o nome do titular"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="usuario">Número de usuário</label>

                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Digite o número de usuário"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="deposito">Código depósito</label>

                    <input
                        type="text"
                        id="deposito"
                        name="deposito"
                        placeholder="Digite o código depósito"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="recebido">Código recebido</label>

                    <input
                        type="text"
                        id="recebido"
                        name="recebido"
                        placeholder="Digite o código recebido"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="segundo">Segundo código</label>

                    <input
                        type="text"
                        id="segundo"
                        name="segundo"
                        placeholder="Digite o segundo código"
                        required
                    >
                </div>

                <button type="submit" class="botao">
                    <span>Confirmar registro</span>
                    <span class="seta" aria-hidden="true">→</span>
                </button>

                <p class="aviso">
                    O botão acima leva para a página de confirmação!
                </p>

                <p
                    id="mensagem"
                    class="mensagem"
                    role="status"
                    aria-live="polite"
                ></p>

            </form>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
